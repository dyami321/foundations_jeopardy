async function loadHistory(){
  history={sessions:0,topics:{}};
  try{ if(!window.storage) return;
    const r=await window.storage.get("lawjeop:v2");
    if(r&&r.value) history=JSON.parse(r.value);
  }catch(e){}
  refreshRestoreLabel();
}
async function saveHistory(){
  try{ if(!window.storage||!history) return;
    await window.storage.set("lawjeop:v2",JSON.stringify(history));
  }catch(e){}
}
function recordHistory(){
  if(!history) return;
  history.sessions=(history.sessions||0)+1;
  log.forEach(a=>{
    const h=history.topics[a.t]||(history.topics[a.t]={seen:0,missed:0});
    h.seen++; if(!a.ok) h.missed++;
  });
  saveHistory();
}
const TIDS=Object.keys(TOPICS).sort();
const c36=n=>Math.max(0,Math.min(35,n|0)).toString(36);
function makeCode(){
  if(!history) return "";
  let out="LW"+c36(history.sessions||0);
  TIDS.forEach((id,i)=>{const h=history.topics[id];
    if(h&&h.seen) out+=c36(i)+c36(h.seen)+c36(h.missed);});
  return out;
}
function readCode(code){
  code=(code||"").trim().replace(/\s+/g,"");
  if(!/^LW[0-9a-z]+$/i.test(code)||(code.length-3)%3!==0) return null;
  const out={sessions:parseInt(code[2],36)||0,topics:{}};
  for(let i=3;i<code.length;i+=3){
    const id=TIDS[parseInt(code[i],36)];
    if(!id) return null;
    out.topics[id]={seen:parseInt(code[i+1],36),missed:parseInt(code[i+2],36)};
  }
  return out;
}
function refreshRestoreLabel(){
  const b=$("restore"); if(!b||!history) return;
  const n=Object.keys(history.topics||{}).length;
  b.textContent=n?("Progress loaded \u2014 "+n+" topics"):"Paste a save code";
}
function promptRestore(){
  const raw=window.prompt("Paste your save code:");
  if(raw===null) return;
  const p=readCode(raw);
  if(!p){window.alert("That code was not readable. It should begin with LW.");return;}
  history=p; saveHistory(); refreshRestoreLabel();
  window.alert("Restored. "+Object.keys(p.topics).length+" topics carried over.");
}

}
function renderBoard(){
  const r=DATA.rounds[roundIdx];
  $("roundName").textContent=r.name;
  $("advance").textContent=roundIdx<DATA.rounds.length-1?"Skip ahead":"Skip to the final";
  board.innerHTML="";
  r.categories.forEach((cat,ci)=>{
    const col=document.createElement("div"); col.className="col";
    const h=document.createElement("div"); h.className="cat"; h.textContent=cat.title;
    col.appendChild(h);
    if(isNarrow()){
      const g=document.createElement("div"); g.className="colgrid";
      cat.clues.forEach((_,ri)=>g.appendChild(makeCell(ci,ri)));
      col.appendChild(g);
    } else cat.clues.forEach((_,ri)=>col.appendChild(makeCell(ci,ri)));
    board.appendChild(col);
  });
  renderScore();
}

/* ---------- clue flow ---------- */
function openClue(ci,ri){
  pendingKey=key(ci,ri);
  const cat=DATA.rounds[roundIdx].categories[ci];
  const item=cat.clues[ri], v=valueOf(ri);
  if(ddSet.has(ci*5+ri)) askWager(cat.title,item,v);
  else showClue(cat.title,item,v,false);
}
function askWager(catTitle,item,v){
  const cap=Math.max(score,v,DATA.rounds[roundIdx].base*5);
  sheet.innerHTML=ARCH+'<div class="dd">DAILY DOUBLE</div>'
    +'<div class="eyebrow">'+esc(catTitle).toUpperCase()+'</div>'
    +'<p class="clue">How much do you want to risk?</p>'
    +'<input class="wager" id="wagerIn" type="number" min="0" max="'+cap+'" value="'+v+'" inputmode="numeric">'
    +'<p class="hint">Anything up to $'+cap.toLocaleString()+'.</p>'
    +'<div class="row"><button class="btn primary" id="wagerGo">Show the clue</button></div>';
  openVeil();
  const inp=$("wagerIn"); inp.focus(); inp.select();
  const go=()=>{let w=parseInt(inp.value,10); if(isNaN(w)||w<0)w=0; if(w>cap)w=cap;
    showClue(catTitle,item,w,true);};
  $("wagerGo").onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go();};
}
function showClue(catTitle,item,amount,isDD){
  sheet.innerHTML=ARCH+(isDD?'<div class="dd">DAILY DOUBLE</div>':'')
    +'<div class="eyebrow">'+esc(catTitle).toUpperCase()+' <span class="amt">$'+amount.toLocaleString()+'</span></div>'
    +'<p class="clue">'+esc(item.clue)+'</p>'
    +'<div class="row"><button class="btn primary" id="revealBtn">Reveal the response</button></div>';
  openVeil(); $("revealBtn").focus();
  $("revealBtn").onclick=()=>reveal(catTitle,item,amount);
}
function reveal(catTitle,item,amount){
  sheet.innerHTML=ARCH
    +'<div class="eyebrow">'+esc(catTitle).toUpperCase()+' <span class="amt">$'+amount.toLocaleString()+'</span></div>'
    +'<p class="clue">'+esc(item.clue)+'</p>'+ORN
    +'<p class="answer">'+esc(item.response)+'</p>'
    +(item.note?'<p class="note">'+esc(item.note)+'</p>':'')
    +glyph(item.t)
    +'<div class="row"><button class="btn good" id="gotIt">I had it</button>'
    +'<button class="btn bad" id="missed">I missed it</button></div>';
  $("gotIt").focus();
  $("gotIt").onclick=()=>settle(true,amount,catTitle,item);
  $("missed").onclick=()=>settle(false,amount,catTitle,item);
}
function settle(ok,amount,catTitle,item){
  if(ok){score+=amount;right++;}else{score-=amount;wrong++;}
  log.push({t:item.t,k:item.k,ok,cat:catTitle,item});
  closeVeil();
  if(pendingFinal){pendingFinal=false;recordHistory();showReport();return;}
  done[pendingKey]=true; renderBoard();
  if(leftInRound()===0) nextRound();
}
function nextRound(){
  if(roundIdx<DATA.rounds.length-1){roundIdx++;pickDailyDoubles();renderBoard();window.scrollTo(0,0);}
  else startFinal();
}
function startFinal(){
  pendingFinal=true;
  const f=DATA.final, cap=Math.max(score,0);
  sheet.innerHTML=ARCH+'<div class="dd">THE FINAL</div>'
    +'<div class="eyebrow">'+esc(f.category).toUpperCase()+'</div>'
    +'<p class="clue">How much do you want to risk?</p>'
    +'<input class="wager" id="wagerIn" type="number" min="0" max="'+cap+'" value="'+cap+'" inputmode="numeric">'
    +'<p class="hint">'+(cap>0?"Anything up to $"+cap.toLocaleString()+".":"Your score is at or below zero, so the wager is zero.")+'</p>'
    +'<div class="row"><button class="btn primary" id="wagerGo">Show the clue</button></div>';
  openVeil();
  const inp=$("wagerIn"); inp.focus(); inp.select();
  const go=()=>{let w=parseInt(inp.value,10); if(isNaN(w)||w<0)w=0; if(w>cap)w=cap;
    showClue(f.category,f,w,false);};
  $("wagerGo").onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go();};
}

/* ---------- analysis ---------- */
function tallyBy(fn){
  const m={};
  log.forEach(a=>{const f=fn(a); const e=m[f]=m[f]||{seen:0,missed:0};
    e.seen++; if(!a.ok)e.missed++;});
  return m;
}
const tallyTopics=()=>tallyBy(a=>a.t);

function weakList(){
  const tt=tallyTopics();
  return Object.entries(tt).filter(([,v])=>v.missed>0).map(([id,v])=>{
    const T=TOPICS[id]||{label:id,author:"",weight:1,lesson:0,pages:""};
    const rate=v.missed/v.seen;
    let prior=0;
    if(history&&history.topics[id]&&history.sessions>0){
      const h=history.topics[id];
      prior=Math.max(0,h.missed-v.missed);
    }
    // priority: how badly it broke, scaled by how much the course leans on it,
    // nudged up if it has broken before
    const score=rate*(T.weight||1)*(1+Math.min(prior,3)*0.25);
    return {id,T,...v,rate,prior,score};
  }).sort((a,b)=>b.score-a.score||b.missed-a.missed);
}

function coverage(){
  const tt=tallyTopics(); let have=0,total=0;
  Object.entries(tt).forEach(([id,v])=>{
    const w=(TOPICS[id]||{}).weight||1;
    total+=w; have+=w*((v.seen-v.missed)/v.seen);
  });
  return total?Math.round(have/total*100):0;
}

function barRow(label,who,missed,seen,extra){
  const pct=seen?Math.round(missed/seen*100):0;
  const cls=pct>=67?"hot":pct>=34?"warm":"cool";
  return '<div class="trow"><div class="tname">'+esc(label)
    +(who?' <span class="who">'+esc(who)+'</span>':'')
    +(extra||'')+'</div><div class="bar"><i class="'+cls+'" style="width:'
    +Math.max(pct,5)+'%"></i></div><div class="tnum">'+missed+' of '+seen+'</div></div>';
}

/* ---------- the report ---------- */
function showReport(){
  $("boardArea").hidden=true;
  $("roundName").textContent="The reckoning";
  const area=$("resultsArea"); area.hidden=false; area.className="report";
  window.scrollTo(0,0);

  const weak=weakList();
  const byLesson=tallyBy(a=>(TOPICS[a.t]||{}).lesson||0);
  const byAuthor=Object.entries(tallyBy(a=>(TOPICS[a.t]||{}).author||"\u2014"))
    .filter(([,v])=>v.missed>0).sort((a,b)=>b[1].missed-a[1].missed);
  const byKind=Object.entries(tallyBy(a=>a.k))
    .filter(([,v])=>v.missed>0).sort((a,b)=>(b[1].missed/b[1].seen)-(a[1].missed/a[1].seen)||b[1].missed-a[1].missed);
  const cov=coverage();

  /* --- triage: the three that pay most --- */
  const top=weak.slice(0,3);
  const triHtml=top.length?'<div class="triage">'+top.map((w,i)=>{
    const L=LESSONS[w.T.lesson];
    const bits=[];
    if(w.T.weight>=3) bits.push("the course leans on this one");
    if(w.prior>0) bits.push("you have missed it before");
    if(w.rate===1) bits.push("missed every time it came up");
    const act="Read "+(L?L.pages.replace("Brauch","Brauch")+", ":"")
      +"the entry below, then the drill."+(bits.length?" Flagged because "+bits.join(", ")+".":"");
    return '<div class="tri"><div class="n">'+(i+1)+'</div><div class="body">'
      +'<div class="lab">'+esc(w.T.label)+'<em>'+esc(w.T.author)+'</em></div>'
      +'<div class="act">'+esc(act)+'</div></div></div>';
  }).join("")+'</div>':'<p class="prose clean2">Nothing to triage. Every topic came back clean.</p>';

  /* --- by assignment --- */
  const lessonHtml=[1,2,3,4,5].map(n=>{
    const v=byLesson[n]; if(!v) return "";
    const L=LESSONS[n];
    return barRow(L.name.replace(/^Assignment \d+ \u2014 /,"Assignment "+n+": "),L.pages,v.missed,v.seen,"");
  }).join("");

  /* --- the full weakness list --- */
  const weakHtml=weak.length?weak.map(w=>{
    let extra="";
    if(w.prior>0) extra+=' <span class="repeat">seen before</span>';
    if(consolidated.has(w.id)) extra+=' <span class="fixed">fixed in drill</span>';
    return barRow(w.T.label,w.T.author,w.missed,w.seen,extra);
  }).join(""):'<p class="prose clean2">Nothing missed.</p>';

  /* --- the pattern --- */
  const parts=[];
  if(byAuthor.length) parts.push("Most of the damage is on <strong>"+esc(byAuthor[0][0])+"</strong>"
    +(byAuthor.length>1?", then "+esc(byAuthor[1][0]):"")+".");
  if(byKind.length){
    const k=byKind[0];
    parts.push("The kind of recall that failed most often was <strong>"+esc(k[0])+"</strong>, at "
      +k[1].missed+" of "+k[1].seen+". "+(KINDNOTE[k[0]]||""));
  }
  const worstLesson=Object.entries(byLesson).filter(([n,v])=>n!=="0"&&v.missed>0)
    .sort((a,b)=>(b[1].missed/b[1].seen)-(a[1].missed/a[1].seen))[0];
  if(worstLesson) parts.push("By assignment the weakest is <strong>"
    +esc(LESSONS[worstLesson[0]].name)+"</strong>, "+LESSONS[worstLesson[0]].pages+".");

  /* --- structural holes: clusters of linked topics all missed --- */
  const weakIds=new Set(weak.map(w=>w.id));
  const chains=[];
  weak.forEach(w=>{
    const linked=(w.T.see||[]).filter(id=>weakIds.has(id)&&id!==w.id);
    if(linked.length>=2) chains.push({id:w.id,T:w.T,linked});
  });
  const unseen=[];
  weak.forEach(w=>{(w.T.see||[]).forEach(id=>{
    if(!weakIds.has(id)&&TOPICS[id]&&!unseen.some(u=>u.id===id)) unseen.push({id,T:TOPICS[id],from:w.T.label});});});

  let chainHtml="";
  if(chains.length) chainHtml+=chains.slice(0,4).map(c=>
    '<p class="chain"><b>'+esc(c.T.label)+'</b> broke along with '
    +c.linked.map(id=>esc(TOPICS[id].label)).join(" and ")
    +'. That is a connected run rather than three separate slips, so read them together.</p>').join("");
  if(unseen.length) chainHtml+='<p class="chain">Worth checking even though you got them: '
    +unseen.slice(0,6).map(u=>esc(u.T.label)).join(", ")+'. Each hangs off something you missed.</p>';
  if(!chainHtml) chainHtml='<p class="prose">No connected runs. What you missed looks like scattered detail rather than a structural hole, which is the better problem to have.</p>';

  /* --- study guide, grouped by assignment --- */
  let guideHtml="";
  [1,2,3,4,5].forEach(n=>{
    const inL=weak.filter(w=>w.T.lesson===n);
    if(!inL.length) return;
    guideHtml+='<div class="lessonhead">'+esc(LESSONS[n].name.toUpperCase())+' \u00b7 '+esc(LESSONS[n].pages)+'</div>';
    guideHtml+=inL.map(w=>'<div class="guide"><div class="gh">'+esc(w.T.label)
      +' <span class="who">'+esc(w.T.author)+'</span></div><p>'+esc(w.T.brief)+'</p></div>').join("");
  });

  const drillCount=weak.reduce((n,w)=>n+((w.T.drills)||[]).length,0);
  const cleanCount=Object.keys(tallyTopics()).length-weak.length;

  area.innerHTML='<div class="verdictline">FINAL SCORE</div>'
   +'<div class="bigscore'+(score<0?" neg":"")+'">'+(score<0?"\u2212":"")+'$'+Math.abs(score).toLocaleString()+'</div>'
   +'<p class="meta">'+right+' right, '+wrong+' wrong'
   +(history&&history.sessions?' \u00b7 '+history.sessions+' session'+(history.sessions===1?"":"s")+' recorded':'')+'.</p>'

   +'<div class="readout">'
   +'<div class="stat'+(cov>=80?" good":cov<60?" warn":"")+'"><b>'+cov+'%</b><span>WEIGHTED COVERAGE</span></div>'
   +'<div class="stat good"><b>'+cleanCount+'</b><span>TOPICS CLEAN</span></div>'
   +'<div class="stat'+(weak.length?" warn":"")+'"><b>'+weak.length+'</b><span>TOPICS SHAKY</span></div>'
   +'<div class="stat"><b>'+drillCount+'</b><span>DRILL QUESTIONS WAITING</span></div>'
   +'</div>'

   +'<section class="rep"><h3>START HERE</h3>'
   +'<p class="sub2">Ranked by how badly it broke, weighted by how hard the course leans on it, and nudged up if you have missed it before.</p>'
   +triHtml+'</section>'

   +(lessonHtml?'<section class="rep"><h3>BY ASSIGNMENT</h3>'
     +'<p class="sub2">Where to point an hour of reading.</p>'+lessonHtml+'</section>':'')

   +((parts.length)?'<section class="rep"><h3>THE PATTERN</h3>'
     +'<p class="prose">'+parts.join(" ")+'</p></section>':'')

   +'<section class="rep"><h3>CONNECTED RUNS</h3>'
   +'<p class="sub2">Whether the misses are scattered detail or a hole in the structure.</p>'
   +chainHtml+'</section>'

   +(weak.length?'<section class="rep"><h3>EVERY TOPIC YOU MISSED</h3>'
     +'<p class="sub2">Worst rate first.</p>'+weakHtml+'</section>':'')

   +(guideHtml?'<section class="rep"><h3>STUDY GUIDE</h3>'
     +'<p class="sub2">Only what you missed, grouped by assignment. Read before drilling.</p>'
     +guideHtml+'</section>':'')

   +'<section class="rep"><h3>SAVE CODE</h3>'
   +'<p class="sub2">Paste this at the start of your next round and your miss history carries over, wherever you open this.</p>'
   +'<p class="codebox" id="codeBox">'+esc(makeCode())+'</p>'
   +'<div class="controls"><button class="btn" id="copyCode">Copy the code</button></div></section>'

   +'<div class="controls" style="margin-top:34px">'
   +(drillCount?'<button class="btn primary" id="drillBtn">Drill these \u00b7 '+drillCount+' questions</button>':'')
   +'<button class="btn" id="again">New board</button></div>';

  if(drillCount) $("drillBtn").onclick=()=>startDrill(weak.map(w=>w.id));
  $("copyCode").onclick=async()=>{
    const code=makeCode(), b=$("copyCode");
    try{ await navigator.clipboard.writeText(code); b.textContent="Copied"; }
    catch(e){ const r=document.createRange(); r.selectNodeContents($("codeBox"));
      const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
      b.textContent="Selected \u2014 hold and copy"; }
    setTimeout(()=>{b.textContent="Copy the code";},2200);
  };
  $("again").onclick=resetAll;
  renderScore();
}

function resetAll(){
  roundIdx=0;score=0;right=0;wrong=0;log=[];done={};pendingFinal=false;
  consolidated=new Set();drilled=false;
  $("resultsArea").hidden=true; $("boardArea").hidden=false;
  pickDailyDoubles(); renderBoard(); window.scrollTo(0,0);
}

/* ---------- drill ---------- */
let drill={items:[],i:0,ok:0,bad:[],sel:[],topics:[]};
function startDrill(topicIds){
  const items=[];
  topicIds.forEach(id=>{const T=TOPICS[id]; if(!T||!T.drills) return;
    T.drills.forEach(d=>items.push(Object.assign({},d,{topic:id,label:T.label,author:T.author})));});
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
  drill={items,i:0,ok:0,bad:[],sel:[],topics:topicIds.slice()};
  renderDrill();
}
function renderDrill(){
  const d=drill.items[drill.i];
  if(!d) return drillSummary();
  drill.sel=[];
  const multi=d.type==="pick";
  sheet.innerHTML=ARCH
    +'<div class="eyebrow">'+esc(d.label).toUpperCase()+' <span class="amt">'+esc(d.author)+'</span></div>'
    +'<p class="prog">'+(drill.i+1)+' OF '+drill.items.length+'</p>'
    +'<p class="clue" style="font-size:1.26rem">'+esc(d.prompt)+'</p>'
    +(multi?'<p class="hint">Select every one that applies.</p>':'')
    +'<div id="opts" style="text-align:left;max-width:580px;margin:14px auto 0"></div>'
    +(multi?'<div class="row"><button class="btn primary" id="check">Check</button></div>':'');
  openVeil();
  const box=$("opts");
  d.options.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="opt"; b.type="button";
    b.innerHTML='<span class="mk">'+(multi?"\u25a2":String.fromCharCode(65+i))+'</span>'+esc(o);
    b.onclick=()=>{
      if(multi){
        const at=drill.sel.indexOf(i);
        if(at>-1){drill.sel.splice(at,1);b.classList.remove("sel");b.querySelector(".mk").textContent="\u25a2";}
        else{drill.sel.push(i);b.classList.add("sel");b.querySelector(".mk").textContent="\u25a3";}
      } else gradeDrill([i]);
    };
    box.appendChild(b);
  });
  if(multi) $("check").onclick=()=>gradeDrill(drill.sel.slice());
}
function gradeDrill(sel){
  const d=drill.items[drill.i];
  const want=d.type==="pick"?d.correct.slice().sort((a,b)=>a-b):[d.correct];
  const got=sel.slice().sort((a,b)=>a-b);
  const ok=want.length===got.length&&want.every((v,i)=>v===got[i]);
  if(ok)drill.ok++;else drill.bad.push(d);
  [...document.querySelectorAll("#opts .opt")].forEach((b,i)=>{
    b.disabled=true;
    if(want.includes(i))b.classList.add("hit");
    else if(got.includes(i))b.classList.add("err");
  });
  const c=$("check"); if(c)c.remove();
  const tail=document.createElement("div");
  tail.innerHTML='<p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Right.":"Not it.")+'</p>'
    +'<p class="why">'+esc(d.why)+'</p>'
    +glyph(d.topic).replace('class="glyph"','class="glyph drillglyph"')
    +'<div class="row"><button class="btn primary" id="nextD">'
    +(drill.i+1<drill.items.length?"Next":"How it went")+'</button></div>';
  sheet.appendChild(tail);
  $("nextD").focus();
  $("nextD").onclick=()=>{drill.i++;renderDrill();};
}
function drillSummary(){
  const stillBad=[...new Set(drill.bad.map(d=>d.topic))];
  drill.topics.forEach(id=>{if(!stillBad.includes(id)) consolidated.add(id);});
  stillBad.forEach(id=>consolidated.delete(id));
  drilled=true;
  const fixed=drill.topics.filter(id=>!stillBad.includes(id));
  sheet.innerHTML=ARCH+'<div class="eyebrow">DRILL COMPLETE</div>'
    +'<p class="clue" style="font-size:1.4rem">'+drill.ok+' of '+drill.items.length+' correct</p>'+ORN
    +(fixed.length?'<p class="why" style="margin-bottom:10px"><strong>Consolidated:</strong> '
       +fixed.map(id=>esc(TOPICS[id].label)).join(", ")+'.</p>':'')
    +(stillBad.length?'<p class="why"><strong>Still not sticking:</strong> '
       +stillBad.map(id=>esc(TOPICS[id].label)).join(", ")
       +'. Read those entries again before the third pass \u2014 a topic missed twice is a gap in understanding, not in memory.</p>'
       :'<p class="why">Everything came back. Those topics are consolidated.</p>')
    +'<div class="row">'
    +(stillBad.length?'<button class="btn primary" id="redrill">Third pass on those</button>':'')
    +'<button class="btn" id="closeD">Back to the report</button></div>';
  if(stillBad.length) $("redrill").onclick=()=>startDrill(stillBad);
  $("closeD").onclick=()=>{closeVeil();showReport();};
}

/* ---------- boot ---------- */
$("advance").onclick=nextRound;
$("restore").onclick=promptRestore;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!veil.hidden&&!pendingFinal&&drill.items.length===0) closeVeil();
});
let wasNarrow=isNarrow();
window.addEventListener("resize",()=>{
  const now=isNarrow();
  if(now!==wasNarrow){wasNarrow=now;if(!$("boardArea").hidden)renderBoard();}
});
loadHistory();
pickDailyDoubles();
renderBoard();

</script>
